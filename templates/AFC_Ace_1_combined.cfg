[AFC_hub ace_hub1]
switch_pin: virtual

[AFC_hub ace_hub2]
switch_pin: virtual

[AFC_hub ace_hub3]
switch_pin: virtual

[AFC_hub ace_hub4]
switch_pin: virtual

[AFC_ACE Ace_1]
serial_port:  /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
mode: combined
feed_speed: 100
retract_speed: 100
use_feed_assist: True
extruder_assist_length: 50
extruder_assist_speed: 300     # 300 mm/min
sensor_step: 50
calibration_step: 50
max_feed_overshoot: 200



[AFC_lane lane0]
unit: Ace_1:1
hub: ace_hub1
extruder: extruder
feed_length: 1750.0
retract_length: 1680.0
use_feed_assist: True
load_to_hub: True
dist_hub: 50
map:T0

[AFC_lane lane1]
unit: Ace_1:2
hub: ace_hub2
extruder: extruder
feed_length: 1750.0
retract_length: 1680.0
use_feed_assist: True
load_to_hub: True
dist_hub: 50
map:T1

[AFC_lane lane2]
unit: Ace_1:3
hub: ace_hub3
extruder: extruder
feed_length: 1750.0
retract_length: 1680.0
use_feed_assist: True
load_to_hub: True
dist_hub: 50
map:T2

[AFC_lane lane3]
unit: Ace_1:4
hub: ace_hub4
extruder: extruder
feed_length: 1750.0
retract_length: 1680.0
use_feed_assist: True
load_to_hub: True
dist_hub: 50
map:T3

[temperature_sensor ace_temp]
sensor_type: temperature_ace
ace_unit: Ace_1
min_temp: 0
max_temp: 70

[gcode_macro ACE_DRYER]
description: Start ACE filament dryer with configurable settings
gcode:
    {% set unit     = params.UNIT|default("Ace_1") %}
    {% set temp     = params.TEMP|default(50)|int %}
    {% set duration = params.DURATION|default(90)|int %}
    {% set fan      = params.FAN|default(800)|int %}
    RESPOND TYPE=command MSG="ACE Dryer: Starting {unit} at {temp}C for {duration}min, fan {fan}"
    ACE_DRY UNIT={unit} TEMP={temp} DURATION={duration} FAN={fan}

[gcode_macro ACE_DRYER_STOP]
description: Stop ACE filament dryer
gcode:
    {% set unit = params.UNIT|default("Ace_1") %}
    RESPOND TYPE=command MSG="ACE Dryer: Stopping {unit}"
    ACE_DRY_STOP UNIT={unit}
