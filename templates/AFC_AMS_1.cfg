[AFC_OAMS oams1]
oams_idx: 1                 # Index of this OAMS unit as seen by the firmware (1-based)
ptfe_length: 1000            # PTFE/bowden length from hub to hub sensor in mm, run AFC_OAMS_CALIBRATE_PTFE to tune
fps_upper_threshold: 0.8     # FPS pressure value considered "too compressed"
fps_lower_threshold: 0.2     # FPS pressure value considered "too stretched"
fps_is_reversed: False       # Set True if the FPS reading direction is inverted for your hardware
f1s_hes_on: 0.5, 0.5, 0.5, 0.5     # Per-bay f1s Hall-effect sensor trigger thresholds
f1s_hes_is_above: True       # Set True if f1s HES value must be ABOVE the threshold to trigger
hub_hes_on: 0.5, 0.5, 0.5, 0.5     # Per-bay hub Hall-effect sensor trigger thresholds
hub_hes_is_above: True       # Set True if hub HES value must be ABOVE the threshold to trigger
# NOTE: the calibration values above are placeholders — run
# AFC_OAMS_CALIBRATE_HUB_HES_ALL / AFC_OAMS_CALIBRATE_PTFE and update
# these to match your hardware before printing.

[AFC_OpenAMS AMS_1]
oams: oams1
extruder: extruder
hub: OAMS_Hub_1

[AFC_lane lane0]
unit: AMS_1:1
load_to_hub: False

[AFC_lane lane1]
unit: AMS_1:2
load_to_hub: False

[AFC_lane lane2]
unit: AMS_1:3
load_to_hub: False

[AFC_lane lane3]
unit: AMS_1:4
load_to_hub: False

[AFC_hub OAMS_Hub_1]
afc_bowden_length: 1725     # Length of the Bowden tube from the hub to the toolhead sensor in mm.
switch_pin: virtual
