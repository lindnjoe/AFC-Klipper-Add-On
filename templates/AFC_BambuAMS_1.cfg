# Stock Bambu Lab AMS driven over its native RS-485 bus.
#
# The AMS is not an MCU. A Raspberry Pi Pico running the `bambu_ams_bridge`
# firmware (a separate project) is the Bambu-Bus master, and Klipper talks to
# that Pico over USB-CDC. So `serial_port` below is the PICO's port, NOT an
# [mcu] section -- flash and wire the bridge first, then come back to this.
#
# One [AFC_BambuAMS] section per physical unit. Several units share one bridge
# and one wire: each is addressed by its CLASS (0x0700 boxed, 0x1800 HT) plus
# its position in the chain, so the sections differ only in name, lanes and
# ams_model. Run BAMBU_UIDS after first boot to read each unit's UID off the
# wire and paste it into unit_uid, which pins a unit to its chain position.


# The AMS multiplexes internally and has no external hub switch, so it uses a
# VIRTUAL hub: slot presence drives each lane's prep state, and the hub reads
# occupied only while a lane is threaded through to the toolhead.
[AFC_hub BambuAMS_hub]
switch_pin: virtual


[AFC_BambuAMS BambuAMS_1]
serial_port: /dev/serial/by-id/usb-Raspberry_Pi_Pico_XXXXXXXX-if00
ams_model: ams2                # ams1 = AMS / AMS-lite (no heater, 4 bays)
                               # ams2 = AMS 2 Pro     (heater 65C, 4 bays)
                               # ht   = AMS HT        (heater 85C, 1 bay)
hub: BambuAMS_hub
extruder: extruder
# unit_uid:                    # from BAMBU_UIDS; pins this unit to its slot
                               # in the chain so a re-plug can't renumber it

# ── Motion ──────────────────────────────────────────────────────────
# There are no speed settings here on purpose. The AMS meters its own moves:
# it feeds or retracts at ITS speed, with its own stall-retry and its own
# self-calibrated tube length, until the toolhead sensor or an explicit stop
# ends it. Neither a distance nor a speed we send ever controls one, so the
# old feed_speed / retract_speed / max_speed options only ever sized a
# watchdog and are now fixed constants in the module.
#
# afc_bowden_length is not set here on purpose. It defaults to 3000mm, which
# is long enough for a first load to complete -- and during that load the AMS
# measures its own filament path and writes the real figure back into your
# config automatically. Let it run one load, then look here (or in
# AFC_auto_vars.cfg) for the measured value. There is no dist_hub setting:
# the hub is virtual, so there is nothing to measure.
# eject_buffer: 200            # extra retract when ejecting, mm

# ── RFID ────────────────────────────────────────────────────────────
# auto_scan: True              # read a spool's tag when it is inserted.
                               # A boxed AMS feeds the tag past its own bay
                               # reader; an AMS HT scans autonomously on its
                               # preload switch. BAMBU_SCAN forces a re-read.

# ── Follower ────────────────────────────────────────────────────────
# The AMS regulates its own buffer once loaded; the bridge sustains that.
# follow_when_loaded: True     # keep the follower armed while a lane is loaded
# follow_always: False         # hold the follower window permanently open. On
                               # a unit that does not self-centre this pokes
                               # the feeder continuously and ticks at idle.
# follow_idle_ping: False

# ── Jam detection ───────────────────────────────────────────────────
# Two independent signals, because no single one covers every model: the unit's
# own stall report ("switch_feed rocker stall", "feed finish -1, stall"), and
# buffer starvation (the buffer bottomed out while the extruder keeps pulling).
# fault_detect: True           # act on jams
# fault_pause: True            # pause the print when one is detected

# ── Heater / drying (ams2 and ht only) ──────────────────────────────
# heater:                      # defaults from ams_model; override to force it
# Start with BAMBU_HEATER_START UNIT=BambuAMS_1 TEMP=55 TIME=480, or use the
# [afc_dryer] web panel (templates/AFC_Dryer.cfg) which finds every heater-
# capable unit on the printer by itself.


# Temperature and humidity on the Mainsail/Fluidd card. The chamber reading
# only exists on a unit with a dryer, and only while a cycle is running.
[temperature_sensor BambuAMS_1]
sensor_type: temperature_bambu
unit: BambuAMS_1


# One lane per bay. The bay index goes in `unit:` as <unit>:<bay>, 1-based.
# An AMS HT has a single bay, so it gets one lane.
[AFC_lane lane1]
unit: BambuAMS_1:1

[AFC_lane lane2]
unit: BambuAMS_1:2

[AFC_lane lane3]
unit: BambuAMS_1:3

[AFC_lane lane4]
unit: BambuAMS_1:4
