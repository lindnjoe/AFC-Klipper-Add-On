# ═══════════════════════════════════════════════════════════════════════════
#  Anycubic ACE (V1 / "Color Engine Pro") — AFC unit config
#
#  Works for ONE ACE, or a DAISY CHAIN of up to 4. Each ACE is its OWN USB
#  serial device (they share only the filament path), so a chain is just one
#  [AFC_ACE …] block per unit — copy the ACE_1 block and bump ace_index.
#
#  RFID: the ACE runs fine WITHOUT the host-side RFID module ([AFC_ACE2_rfid]) —
#  true for both V1 ACE and ACE 2 Pro. That module is OPTIONAL; add it only if
#  you want Spoolman sync and the other advanced RFID features. (V1 ACE also
#  reads basic material info in its own firmware regardless.)
# ═══════════════════════════════════════════════════════════════════════════


# ── Unit 1: the head (or the only unit) ────────────────────────────────────
[AFC_ACE ACE_1]
type: ACE

# ── Serial binding — pick ONE style ──
# serial_port: auto
#     Autodetect this unit by its firmware id (recommended, especially for a
#     chain). The ACE self-reports a stable id in get_info that counts up by
#     cable order (first unit = 1); this section binds to the unit whose id
#     equals ace_index below. It rides the ACE's constant ttyACM
#     re-enumeration and comes back to the SAME unit on every reboot — as long
#     as you don't move a box to a different USB port.
#
# serial_port: /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
#     LOCK to a specific port instead — pins this section to that physical box,
#     autodetect skipped. Use `ls -l /dev/serial/by-id/` to find yours.
#
# (Omit serial_port entirely to keep the original single-unit behavior.)
serial_port: auto
ace_index: 1              # which ACE in cable order (= the firmware get_info id)

hub: ACE_1_hub
# Per-unit ACE tuning is optional; sane defaults suit a stock unit. Common ones
# (see extras/AFC_ACE.py for the full list):
#   feed_speed: 100              # mm/s (stock firmware caps at 100)
#   retract_speed: 100
#   prep_ready_timeout: 90       # s to wait for the unit's load-to-tool cycle
#   max_dryer_temperature: 55    # safety cap for ACE_DRY
#   use_feed_assist: True
#   stuck_spool_detection: True

# ACE has a virtual (pinless) hub — no physical hub sensor to wire.
[AFC_hub ACE_1_hub]
cut: False

# One lane per slot (ACE has 4). ACE is a load-only (stepperless) unit: the
# lane is declared, but the ACE drives the filament, not a Klipper stepper.
[AFC_stepper lane1]
unit: ACE_1:1             # ACE_1, slot 1
[AFC_stepper lane2]
unit: ACE_1:2
[AFC_stepper lane3]
unit: ACE_1:3
[AFC_stepper lane4]
unit: ACE_1:4


# ── Unit 2: daisy-chained. Add one block per extra ACE, ace_index up to 4. ──
# Only difference from unit 1 is ace_index (and unique names/lanes). With
# serial_port: auto, this section automatically binds to the 2nd ACE in cable
# order (the one reporting get_info id:2) — no ttyACM/by-path to hand-copy.
[AFC_ACE ACE_2]
type: ACE
serial_port: auto
ace_index: 2
hub: ACE_2_hub

[AFC_hub ACE_2_hub]
cut: False

[AFC_stepper lane5]
unit: ACE_2:1
[AFC_stepper lane6]
unit: ACE_2:2
[AFC_stepper lane7]
unit: ACE_2:3
[AFC_stepper lane8]
unit: ACE_2:4

# … ACE_3 (ace_index: 3) and ACE_4 (ace_index: 4) follow the same pattern.
